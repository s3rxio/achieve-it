# Сделано онли для того чтобы не париться запускать бдшки)

name: achieve-it
services:
  postgres:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: achieve_it

  redis:
    image: redis
    ports:
      - "6379:6379"
